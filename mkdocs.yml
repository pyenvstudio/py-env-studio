site_name: Py Env Studio
site_url: https://py-env-studio.readthedocs.io
repo_url: https://github.com/pyenvstudio/py-env-studio
repo_name: pyenvstudio/py-env-studio

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy
    - toc.integrate
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: blue
      accent: cyan
    - scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/install.md
      - Usage: getting-started/usage.md
      - CLI Reference: getting-started/cli.md
  - Reference:
      - Features: reference/features.md
      - Architecture: reference/architecture.md
  - Templates:
      - Phase 1: project-templates/phase-1.md
      - Phase 1.2: project-templates/phase-1-2.md
      - Community Templates: project-templates/community-templates.md
  - Development:
      - Contributing: development/contributing.md
  - Plugins:
      - Overview: plugins/index.md
      - Architecture: plugins/architecture.md
      - Development Guide: plugins/development.md
      - Quick Reference: plugins/quick-reference.md
  - Releases:
      - v2.0.8: releases/v2.0.8.md

plugins:
  - search
  - mkdocstrings

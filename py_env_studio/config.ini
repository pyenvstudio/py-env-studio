[project]
version = 2.1.0

[settings]
venv_dir = ~/.py_env_studio/venvs
log_file = py_env_studio.log
db_file = data/py_env_studio.db
matrix_file = data/security_matrix_lts.json
open_with_tools = CMD
preferred_package_manager = pip
auto_resolve_dependencies = true
preferred_project_editor = powershell

# MCP control plane (BETA): local stdio transport, read-only tools.
# Set enabled = false to refuse `py-env-studio mcp` startup.
[mcp]
enabled = true
server_name = py-env-studio
transport = stdio
log_level = INFO

